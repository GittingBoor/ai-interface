<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>AI Interface</title>
    <style>
      /* Start-Logo bis zum ersten React-Render; React ersetzt den Inhalt von #root. */
      html, body { margin: 0; background: #0f0e0c; }
      .boot { height: 100vh; display: grid; place-items: center; }
      .boot svg { width: 44px; height: 44px; animation: boot-in 420ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      .boot-caret { animation: boot-blink 1.1s steps(1, end) 420ms infinite; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.94); } }
      @keyframes boot-blink { 50% { opacity: 0.2; } }
      @media (prefers-reduced-motion: reduce) { .boot svg, .boot-caret { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="img" aria-label="AI Interface wird geladen">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <defs>
            <linearGradient id="boot-tile" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#26221e" />
              <stop offset="1" stop-color="#13100e" />
            </linearGradient>
          </defs>
          <rect width="16" height="16" rx="3.5" fill="url(#boot-tile)" />
          <rect x="0.2" y="0.2" width="15.6" height="15.6" rx="3.3" fill="none" stroke="#514c47" stroke-opacity="0.55" stroke-width="0.4" />
          <polygon points="2,13 5,3 7,3 10,13 7.7,13 6,7.33 4.3,13" fill="#f2f0ec" stroke="#f2f0ec" stroke-width="0.5" stroke-linejoin="round" />
          <rect class="boot-caret" x="11" y="2" width="2" height="12" rx="0.6" fill="#fb9344" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
